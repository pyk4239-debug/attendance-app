name: 출퇴근 자동 알림

on:
  schedule:
    # 매 5분마다 실행 (KST 기준 시간 체크)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 출퇴근 알림 발송
        run: |
          node << 'EOF'
          const https = require('https');

          const FIREBASE_API_KEY = process.env.FIREBASE_API_KEY;
          const FIREBASE_PROJECT_ID = process.env.FIREBASE_PROJECT_ID;
          const ONESIGNAL_APP_ID = process.env.ONESIGNAL_APP_ID;
          const ONESIGNAL_API_KEY = process.env.ONESIGNAL_API_KEY;

          // Firestore REST API 호출
          async function fetchFirestore(collection, docId) {
            return new Promise((resolve, reject) => {
              const url = docId
                ? `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${collection}/${docId}?key=${FIREBASE_API_KEY}`
                : `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${collection}?key=${FIREBASE_API_KEY}`;
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          // Firestore 값 파싱
          function parseField(field) {
            if (!field) return null;
            if (field.stringValue !== undefined) return field.stringValue;
            if (field.integerValue !== undefined) return Number(field.integerValue);
            if (field.booleanValue !== undefined) return field.booleanValue;
            if (field.arrayValue) return (field.arrayValue.values || []).map(parseField);
            if (field.mapValue) return parseFields(field.mapValue.fields || {});
            return null;
          }

          function parseFields(fields) {
            const result = {};
            for (const [k, v] of Object.entries(fields)) result[k] = parseField(v);
            return result;
          }

          // OneSignal 알림 발송
          async function sendPush(title, message, userIds) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                app_id: ONESIGNAL_APP_ID,
                headings: { en: title, ko: title },
                contents: { en: message, ko: message },
                filters: userIds.map((id, i) => [
                  ...(i > 0 ? [{ operator: 'OR' }] : []),
                  { field: 'tag', key: 'userId', relation: '=', value: id }
                ]).flat()
              });

              const options = {
                hostname: 'onesignal.com',
                path: '/api/v1/notifications',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Basic ${ONESIGNAL_API_KEY}`,
                  'Content-Length': Buffer.byteLength(body)
                }
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => { console.log('발송 결과:', data); resolve(); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            // KST 현재 시간
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const hh = kst.getUTCHours();
            const mm = kst.getUTCMinutes();
            const today = kst.toISOString().slice(0, 10);
            const dayOfWeek = kst.getUTCDay(); // 0=일, 6=토

            console.log(`KST: ${hh}:${String(mm).padStart(2,'0')} (${today})`);

            // 주말 건너뜀
            if (dayOfWeek === 0 || dayOfWeek === 6) {
              console.log('주말 - 알림 없음');
              return;
            }

            // Settings 읽기
            const settingsDoc = await fetchFirestore('settings', 'main');
            if (!settingsDoc.fields) { console.log('settings 없음'); return; }
            const settings = parseFields(settingsDoc.fields);

            const workStart = settings.workStart || '09:00'; // "07:30"
            const workEnd = settings.workEnd || '18:00';     // "16:10"
            const holidays = settings.holidays || [];

            // 공휴일 건너뜀
            if (holidays.includes(today)) {
              console.log('공휴일 - 알림 없음');
              return;
            }

            const [startH, startM] = workStart.split(':').map(Number);
            const [endH, endM] = workEnd.split(':').map(Number);

            const currentMinutes = hh * 60 + mm;
            const startMinutes = startH * 60 + startM;
            const endMinutes = endH * 60 + endM;

            // 출근 5분 전 체크
            const isCheckinAlert = currentMinutes === startMinutes - 5;
            // 퇴근 1분 후 체크
            const isCheckoutAlert = currentMinutes === endMinutes + 1;

            if (!isCheckinAlert && !isCheckoutAlert) {
              console.log('알림 시간 아님');
              return;
            }

            // 팀원 목록 읽기
            const usersDoc = await fetchFirestore('users', 'members');
            if (!usersDoc.fields) { console.log('users 없음'); return; }
            const usersData = parseFields(usersDoc.fields);
            const members = (usersData.list || []).filter(u => u.role === 'member');

            // 오늘 근태 기록 읽기
            const recordsSnap = await fetchFirestore('records');
            const recordMap = {};
            for (const doc of (recordsSnap.documents || [])) {
              const parts = doc.name.split('/');
              const docId = parts[parts.length - 1]; // userId_date
              const fields = parseFields(doc.fields || {});
              recordMap[docId] = fields;
            }

            // 오늘 연차 읽기
            const leavesSnap = await fetchFirestore('leaves');
            const leaveSet = new Set();
            for (const doc of (leavesSnap.documents || [])) {
              const parts = doc.name.split('/');
              const docId = parts[parts.length - 1]; // userId_date
              const fields = parseFields(doc.fields || {});
              if (fields.date === today && !fields.deleted) leaveSet.add(fields.userId);
            }

            if (isCheckinAlert) {
              // 미출근 팀원 (연차 제외)
              const absentIds = members
                .filter(u => !leaveSet.has(u.id) && !recordMap[`${u.id}_${today}`]?.in)
                .map(u => u.id);

              if (absentIds.length > 0) {
                console.log('출근 알림 대상:', absentIds);
                await sendPush(
                  '⏰ 출근 시간 알림',
                  `출근 시간 ${workStart} 5분 전입니다. 출근 기록을 해주세요!`,
                  absentIds
                );
              } else {
                console.log('모두 출근 완료');
              }
            }

            if (isCheckoutAlert) {
              // 미퇴근 팀원 (연차 제외)
              const notOutIds = members
                .filter(u => !leaveSet.has(u.id) && recordMap[`${u.id}_${today}`]?.in && !recordMap[`${u.id}_${today}`]?.out)
                .map(u => u.id);

              if (notOutIds.length > 0) {
                console.log('퇴근 알림 대상:', notOutIds);
                await sendPush(
                  '🏠 퇴근 시간 알림',
                  `퇴근 시간 ${workEnd}이 지났습니다. 퇴근 기록을 해주세요!`,
                  notOutIds
                );
              } else {
                console.log('모두 퇴근 완료');
              }
            }
          }

          main().catch(console.error);
          EOF
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
